<div class="books-list">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Books Management</h1>
    <button class="btn btn-primary" routerLink="/books/new">
      <i class="bi bi-plus-circle"></i> Add New Book
    </button>
  </div>

  <div class="card mb-3">
    <div class="card-body">
      <div class="input-group">
        <input type="text" class="form-control" placeholder="Search books by title, author, ISBN, or category..." 
               [(ngModel)]="searchQuery" (keyup.enter)="search()">
        <button class="btn btn-outline-primary" type="button" (click)="search()">
          <i class="bi bi-search"></i> Search
        </button>
        <button class="btn btn-outline-secondary" type="button" (click)="clearSearch()" *ngIf="searchQuery">
          <i class="bi bi-x-circle"></i> Clear
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="loading" class="text-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div class="table-responsive" *ngIf="!loading">
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Author</th>
          <th>ISBN</th>
          <th>Category</th>
          <th>Total Copies</th>
          <th>Available</th>
          <th>Location</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let book of books">
          <td>{{ book.id }}</td>
          <td>{{ book.title }}</td>
          <td>{{ book.author }}</td>
          <td>{{ book.isbn }}</td>
          <td>{{ book.category }}</td>
          <td>{{ book.totalCopies }}</td>
          <td>
            <span [class.text-success]="book.availableCopies > 0" [class.text-danger]="book.availableCopies === 0">
              {{ book.availableCopies }}
            </span>
          </td>
          <td>{{ book.shelfLocation }}</td>
          <td>
            <button class="btn btn-sm btn-info me-1" [routerLink]="['/books/edit', book.id]">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-danger" (click)="deleteBook(book.id)">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="books.length === 0">
          <td colspan="9" class="text-center">No books found</td>
        </tr>
      </tbody>
    </table>
  </div>

  <ngb-pagination *ngIf="totalPages > 0 && !loading"
    [collectionSize]="totalElements"
    [(page)]="currentPage"
    [pageSize]="pageSize"
    (pageChange)="onPageChange($event)"
    class="justify-content-end mt-3">
  </ngb-pagination>
</div>
